spring:
  application:
    name: booking-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/slotwise}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slotwise}
    username: ${DB_USER:slotwise}
    password: ${DB_PASSWORD:slotwise}
  jpa:
    open-in-view: false
    hibernate:
      # ponytail: ddl-auto=update for course-project convenience; replace with Flyway
      # migrations once the schema needs indexes/partitions (Phase 2 of the roadmap).
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
