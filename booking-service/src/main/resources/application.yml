spring:
  application:
    name: booking-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/slotwise}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slotwise}
    username: ${DB_USER:slotwise}
    password: ${DB_PASSWORD:slotwise}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (db/migration) now owns schema DDL — validate only checks entities match it.
      # Switched from ddl-auto=update once reservations needed PARTITION BY, which has no
      # JPA annotation equivalent (same reason the old EXCLUDE-constraint ApplicationRunner
      # existed, now folded into V1__partition_reservations.sql instead).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    # The docker-compose dev DB already has resources/reservations from the old ddl-auto=update
    # regime — baseline-on-migrate treats that existing state as "version 0, already applied"
    # instead of failing on "schema not empty". A fresh DB (Testcontainers) has no baseline
    # row, so it just runs every migration from V1 as normal.
    baseline-on-migrate: true
    baseline-version: "0"

logging:
  pattern:
    # [correlationId] lets you grep every log line for one request across the whole call.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId}] %-40.40logger{39} : %m%n"

slotwise:
  reservation:
    min-duration-minutes: 15
    max-duration-minutes: 480
