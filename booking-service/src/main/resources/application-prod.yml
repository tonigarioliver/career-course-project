spring:
  config:
    activate:
      on-profile: prod
  # ponytail: no defaults here on purpose — a prod deploy missing KEYCLOAK_ISSUER_URI/DB_*
  # should fail to start, not silently fall back to the localhost/dev-Keycloak values in
  # the base application.yml.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # never let Hibernate mutate a prod schema; migrations own that (Flyway, once Phase 2 lands)
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
